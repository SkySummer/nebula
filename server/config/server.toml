[server]
port = 8080
backlog = 1024
max_connections = 4096
sub_reactor_count = 0
worker_thread_count = 0
manage_signals = true

[logger]
level = "info"
dir = "runtime/logs"
also_stderr = true

[timeouts]
read_timeout_ms = 30000
graceful_shutdown_timeout_ms = 5000

[limits]
max_header_bytes = 16384
max_request_target_bytes = 8192
max_body_bytes = 1048576
