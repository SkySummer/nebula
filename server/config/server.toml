[server]
port = 8080
backlog = 1024
max_connections = 4096
sub_reactor_count = 0
worker_thread_count = 0
manage_signals = true

[logger]
level = "info"
dir = "runtime/logs"
also_stderr = true

[timeouts]
read_timeout_ms = 30000
graceful_shutdown_timeout_ms = 5000

[limits]
max_header_bytes = 16384
max_request_target_bytes = 8192
max_body_bytes = 1048576

[routes]
enable_healthz = true
enable_echo = true
enable_root_default = true
root_default_path = "/healthz"

[auth]
jwt_secret_path = "runtime/secrets/jwt.key"
access_token_ttl_s = 3600
password_hash_iterations = 600000

[database]
host = "127.0.0.1"
port = 5432
name = "nebula"
user = "nebula"
password_env = "NEBULA_DATABASE_PASSWORD"
max_connections = 8
connect_timeout_ms = 3000
acquire_timeout_ms = 3000

[storage]
root_dir = "runtime/files"
upload_session_ttl_s = 86400
max_file_mb = 64
